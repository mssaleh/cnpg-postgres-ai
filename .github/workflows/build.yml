name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.dockerignore'
  workflow_dispatch:
    inputs:
      postgresql_version:
        description: "PostgreSQL release to build"
        type: choice
        options: ['18.6', '18.7', '19.0']
        default: '18.7'
      pgvector_version:
        description: "Exact pgvector release (blank = newest stable)"
        required: false
        default: ""
      postgis_version:
        description: "Exact PostGIS release (blank = newest stable)"
        required: false
        default: ""
      timescaledb_version:
        description: "Exact TimescaleDB release (blank = newest stable)"
        required: false
        default: ""
      timescaledb_line:
        description: "TimescaleDB minor line, e.g. 2.31 (blank = newest stable)"
        required: false
        default: ""
      pgvectorscale_version:
        description: "Exact pgvectorscale release tag (blank = newest stable)"
        required: false
        default: ""
      age_version:
        description: "Exact Apache AGE release (blank = newest compatible package)"
        required: false
        default: ""
      upgrade_from_image:
        description: "Upgrade baseline image (blank = previous release for this line)"
        required: false
        default: ""
  # Sunday 02:00 UTC = Sunday 06:00 Asia/Dubai.
  schedule:
    - cron: "0 2 * * 0"

# Serialize workflow runs that publish to the same aliases.
concurrency:
  group: build-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  GHCR_REGISTRY: ghcr.io
  HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY }}
  HARBOR_PROJECT: ${{ vars.HARBOR_PROJECT }}
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: PostgreSQL ${{ matrix.postgresql }}
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        postgresql: ${{ fromJSON(inputs.postgresql_version && format('["{0}"]', inputs.postgresql_version) || '["18.6", "18.7", "19.0"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRESQL_VERSION: ${{ matrix.postgresql }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Check sources
        run: ./scripts/local-ci.sh --check

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        name: Resolve image references
        env:
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image="${GHCR_REGISTRY}/${IMAGE_NAME}"
          image_base="${IMAGE_NAME##*/}"
          date=$(date -u +'%Y-%m-%d')
          candidate="${image}:candidate-${POSTGRESQL_VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          immutable_tags="${POSTGRESQL_VERSION}-${date//-/}-build-${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          rolling_tags="${POSTGRESQL_VERSION}"
          case "${POSTGRESQL_VERSION}" in
            18.7)
              sha=$(git rev-parse --short HEAD)
              immutable_tags+=" 18-${date}-${sha}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              rolling_tags+=" 18 18-latest"
              candidate+=",${image}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              ;;
            19.0) rolling_tags+=" 19" ;;
          esac
          if [ "${OWNER_TYPE}" = "Organization" ]; then
            package_url="https://github.com/orgs/${REPOSITORY_OWNER}/packages/container/package/${image_base}"
          else
            package_url="https://github.com/users/${REPOSITORY_OWNER}/packages/container/package/${image_base}"
          fi
          {
            echo "image=${image}"
            echo "candidate=${candidate}"
            echo "immutable_tags=${immutable_tags}"
            echo "rolling_tags=${rolling_tags}"
            echo "package_url=${package_url}"
            if [ -n "${HARBOR_REGISTRY}" ]; then
              echo "mirror=${HARBOR_REGISTRY}/${HARBOR_PROJECT:-library}/${image_base}"
            fi
          } >> "$GITHUB_OUTPUT"

      - id: candidate
        name: Build and push candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.candidate }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.POSTGRESQL_VERSION }}
          annotations: |
            index,manifest:org.opencontainers.image.description=CloudNativePG-compatible PostgreSQL ${{ env.POSTGRESQL_VERSION }} with pgvector, pgvectorscale, PostGIS, TimescaleDB, and Apache AGE.
            index,manifest:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index,manifest:org.opencontainers.image.licenses=Apache-2.0
            index,manifest:org.opencontainers.image.version=${{ env.POSTGRESQL_VERSION }}
          build-args: |
            CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
            POSTGRESQL_VERSION=${{ env.POSTGRESQL_VERSION }}
            PGVECTOR_VERSION=${{ inputs.pgvector_version }}
            POSTGIS_VERSION=${{ inputs.postgis_version }}
            TIMESCALEDB_VERSION=${{ inputs.timescaledb_version }}
            TIMESCALEDB_LINE=${{ inputs.timescaledb_line }}
            PGVECTORSCALE_VERSION=${{ inputs.pgvectorscale_version }}
            AGE_VERSION=${{ inputs.age_version }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=postgres-${{ env.POSTGRESQL_VERSION }}
          cache-to: type=gha,scope=postgres-${{ env.POSTGRESQL_VERSION }},mode=max

      - name: Verify candidate
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
          UPGRADE_FROM_IMAGE: ${{ inputs.upgrade_from_image }}
        run: |
          set -euo pipefail
          candidate="${IMAGE}@${DIGEST}"
          baseline="${UPGRADE_FROM_IMAGE}"
          if [ -z "${baseline}" ]; then
            previous="${IMAGE}:${POSTGRESQL_VERSION}"
            if result=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${previous}" 2>&1); then
              baseline="${IMAGE}@${result}"
            elif [[ "${result}" == *': not found' ]]; then
              case "${POSTGRESQL_VERSION}" in
                18.6) baseline="${IMAGE}:18-2026-11-01-8693b7c-41288901922-1" ;;
                18.7) baseline="${IMAGE}:18-latest" ;;
                19.0)
                  echo "First release of PostgreSQL ${POSTGRESQL_VERSION}; verifying restart with persistent data"
                  baseline="${candidate}"
                  ;;
              esac
            else
              printf '%s\n' "${result}" >&2
              exit 1
            fi
          fi
          echo "Persistent parity baseline: ${baseline}"
          UPGRADE_FROM_IMAGE="${baseline}" ./scripts/local-ci.sh --verify-only "${candidate}"

      - name: Report resolved packages
        env:
          IMAGE: ${{ steps.meta.outputs.image }}@${{ steps.candidate.outputs.digest }}
          TIMESCALEDB_VERSION: ${{ inputs.timescaledb_version }}
        run: |
          set -euo pipefail
          major="${POSTGRESQL_VERSION%%.*}"
          {
            echo '## Candidate versions'
            echo '```'
            docker run --rm --entrypoint postgres "${IMAGE}" --version
            docker run --rm --entrypoint dpkg-query "${IMAGE}" -W \
              "postgresql-${major}-pgvector" "pgvectorscale-postgresql-${major}" \
              "postgresql-${major}-postgis-3" "timescaledb-2${TIMESCALEDB_VERSION:+-${TIMESCALEDB_VERSION}}-postgresql-${major}" \
              "timescaledb-2-loader-postgresql-${major}" "postgresql-${major}-age"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify anonymous GHCR access
        env:
          IMAGE: ${{ steps.meta.outputs.image }}@${{ steps.candidate.outputs.digest }}
          PACKAGE_URL: ${{ steps.meta.outputs.package_url }}
        run: |
          set -euo pipefail
          tmp_config=$(mktemp -d)
          trap 'rm -rf "${tmp_config}"' EXIT
          if ! DOCKER_CONFIG="${tmp_config}" docker buildx imagetools inspect "${IMAGE}" >/dev/null; then
            echo "::error::Candidate is not publicly readable. Check ${PACKAGE_URL}/settings"
            exit 1
          fi

      - id: cosign
        name: Resolve stable Cosign release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release=$(gh api repos/sigstore/cosign/releases/latest \
            --jq 'select(.draft == false and .prerelease == false) | .tag_name')
          [[ "${release}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "release=${release}" >> "$GITHUB_OUTPUT"

      # Upstream has no floating v4 tag. Keep the published stable installer;
      # resolve the Cosign binary independently of its embedded default.
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.3
        with:
          cosign-release: ${{ steps.cosign.outputs.release }}

      - name: Sign and verify candidate
        env:
          IMAGE: ${{ steps.meta.outputs.image }}@${{ steps.candidate.outputs.digest }}
          CERTIFICATE_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cosign version
          cosign sign "${IMAGE}"
          cosign verify "${IMAGE}" \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - id: promotion
        name: Promote verified candidate
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
          IMMUTABLE_TAGS: ${{ steps.meta.outputs.immutable_tags }}
          ROLLING_TAGS: ${{ steps.meta.outputs.rolling_tags }}
        run: |
          set -euo pipefail
          main=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "${GITHUB_SHA}" != "${main}" ]; then
            echo "main has advanced; publishing build tags only"
            ROLLING_TAGS=""
          fi
          read -ra tags <<< "${IMMUTABLE_TAGS} ${ROLLING_TAGS}"
          ./scripts/promote-image.sh "${IMAGE}@${DIGEST}" "${IMAGE}" "${tags[@]}"
          echo "rolling_tags=${ROLLING_TAGS}" >> "$GITHUB_OUTPUT"

      - id: harbor
        name: Mirror and sign Harbor image (best effort)
        if: env.HARBOR_REGISTRY != ''
        continue-on-error: true
        env:
          IMAGE: ${{ steps.meta.outputs.image }}@${{ steps.candidate.outputs.digest }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
          MIRROR: ${{ steps.meta.outputs.mirror }}
          IMMUTABLE_TAGS: ${{ steps.meta.outputs.immutable_tags }}
          ROLLING_TAGS: ${{ steps.promotion.outputs.rolling_tags }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          CERTIFICATE_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          if [ -z "${HARBOR_USERNAME}" ] || [ -z "${HARBOR_PASSWORD}" ]; then
            echo "::warning::Harbor credentials are not configured"
            exit 1
          fi
          for attempt in 1 2 3; do
            if result=$(printf '%s' "${HARBOR_PASSWORD}" | timeout 30 docker login "${HARBOR_REGISTRY}" \
              --username "${HARBOR_USERNAME}" --password-stdin 2>&1); then
              printf '%s\n' "${result}"
              break
            fi
            printf '%s\n' "${result}" >&2
            if [[ "${result}" != *EOF* || "${attempt}" == 3 ]]; then
              exit 1
            fi
            sleep "${attempt}"
          done
          read -ra immutable <<< "${IMMUTABLE_TAGS}"
          # Harbor's ingress closed the HTTP/2 connection during blob upload.
          GODEBUG=http2client=0 ./scripts/promote-image.sh "${IMAGE}" "${MIRROR}" "${immutable[@]}"
          cosign sign "${MIRROR}@${DIGEST}"
          cosign verify "${MIRROR}@${DIGEST}" \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          if [ -n "${ROLLING_TAGS}" ]; then
            read -ra rolling <<< "${ROLLING_TAGS}"
            ./scripts/promote-image.sh "${MIRROR}@${DIGEST}" "${MIRROR}" "${rolling[@]}"
          fi

      - name: Summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          IMMUTABLE_TAGS: ${{ steps.meta.outputs.immutable_tags }}
          ROLLING_TAGS: ${{ steps.promotion.outputs.rolling_tags }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
          COSIGN_RELEASE: ${{ steps.cosign.outputs.release }}
          HARBOR_OUTCOME: ${{ steps.harbor.outcome }}
        run: |
          read -ra tags <<< "${IMMUTABLE_TAGS} ${ROLLING_TAGS}"
          {
            echo "## PostgreSQL ${POSTGRESQL_VERSION} image published"
            echo '```'
            printf '%s:%s\n' "${IMAGE}" "${tags[0]}"
            printf '%s:%s@%s\n' "${IMAGE}" "${tags[0]}" "${DIGEST}"
            for tag in "${tags[@]:1}"; do
              printf '%s:%s\n' "${IMAGE}" "${tag}"
            done
            echo '```'
            echo "Cosign: ${COSIGN_RELEASE}"
            echo "Harbor mirror and signature: ${HARBOR_OUTCOME}"
          } >> "$GITHUB_STEP_SUMMARY"
