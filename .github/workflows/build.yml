name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.dockerignore'
  workflow_dispatch:
    inputs:
      pgvector_version:
        description: "Exact pgvector release (blank = newest stable)"
        required: false
        default: ""
      postgis_version:
        description: "Exact PostGIS release (blank = newest stable)"
        required: false
        default: ""
      timescaledb_version:
        description: "Exact TimescaleDB release (blank = newest stable)"
        required: false
        default: ""
      timescaledb_line:
        description: "TimescaleDB minor line, e.g. 2.31 (blank = newest stable)"
        required: false
        default: ""
      pgvectorscale_version:
        description: "Exact pgvectorscale release tag (blank = newest stable)"
        required: false
        default: ""
      age_version:
        description: "Exact Apache AGE release (blank = newest available PG18 package)"
        required: false
        default: ""
      upgrade_from_image:
        description: "Upgrade baseline image (blank = previous 18-latest)"
        required: false
        default: ""
  # Sunday 02:00 UTC = Sunday 06:00 Asia/Dubai.
  schedule:
    - cron: "0 2 * * 0"

# Serialize promotions so an older run cannot replace a newer release.
concurrency:
  group: build-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  GHCR_REGISTRY: ghcr.io
  HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY }}
  HARBOR_PROJECT: ${{ vars.HARBOR_PROJECT }}
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Check sources
        run: ./scripts/local-ci.sh --check

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        name: Resolve image references
        env:
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          date=$(date -u +'%Y-%m-%d')
          sha=$(git rev-parse --short HEAD)
          image="${GHCR_REGISTRY}/${IMAGE_NAME}"
          image_base="${IMAGE_NAME##*/}"
          release="18-${date}-${sha}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ "${OWNER_TYPE}" = "Organization" ]; then
            package_url="https://github.com/orgs/${REPOSITORY_OWNER}/packages/container/package/${image_base}"
          else
            package_url="https://github.com/users/${REPOSITORY_OWNER}/packages/container/package/${image_base}"
          fi
          {
            echo "image=${image}"
            echo "candidate=${image}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "immutable=${image}:${release}"
            echo "latest=${image}:18-latest"
            echo "package_url=${package_url}"
            if [ -n "${HARBOR_REGISTRY}" ]; then
              mirror="${HARBOR_REGISTRY}/${HARBOR_PROJECT:-library}/${image_base}"
              echo "harbor_immutable=${mirror}:${release}"
              echo "harbor_latest=${mirror}:18-latest"
            fi
          } >> "$GITHUB_OUTPUT"

      - id: candidate
        name: Build and push candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.candidate }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            index,manifest:org.opencontainers.image.description=CloudNativePG-compatible Postgres 18 with pgvector, pgvectorscale, PostGIS, TimescaleDB, and Apache AGE.
            index,manifest:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index,manifest:org.opencontainers.image.licenses=Apache-2.0
          build-args: |
            CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
            PGVECTOR_VERSION=${{ inputs.pgvector_version }}
            POSTGIS_VERSION=${{ inputs.postgis_version }}
            TIMESCALEDB_VERSION=${{ inputs.timescaledb_version }}
            TIMESCALEDB_LINE=${{ inputs.timescaledb_line }}
            PGVECTORSCALE_VERSION=${{ inputs.pgvectorscale_version }}
            AGE_VERSION=${{ inputs.age_version }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify candidate
        run: ./scripts/local-ci.sh --verify-only "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
          UPGRADE_FROM_IMAGE: ${{ inputs.upgrade_from_image || format('ghcr.io/{0}:18-latest', github.repository) }}

      - name: Report resolved packages
        env:
          IMAGE: ${{ steps.meta.outputs.image }}@${{ steps.candidate.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo '## Candidate versions'
            echo '```'
            docker run --rm --entrypoint bash "${IMAGE}" -c '
              set -euo pipefail
              postgres --version
              dpkg-query -W postgresql-18-pgvector pgvectorscale-postgresql-18 \
                postgresql-18-postgis-3 timescaledb-2-postgresql-18 \
                timescaledb-2-loader-postgresql-18 postgresql-18-age
            '
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify anonymous GHCR access
        env:
          IMAGE: ${{ steps.meta.outputs.image }}@${{ steps.candidate.outputs.digest }}
          PACKAGE_URL: ${{ steps.meta.outputs.package_url }}
        run: |
          set -euo pipefail
          tmp_config=$(mktemp -d)
          trap 'rm -rf "${tmp_config}"' EXIT
          if ! DOCKER_CONFIG="${tmp_config}" docker buildx imagetools inspect "${IMAGE}" >/dev/null; then
            echo "::error::Candidate is not publicly readable. Check ${PACKAGE_URL}/settings"
            exit 1
          fi

      - id: cosign
        name: Resolve stable Cosign release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release=$(gh api repos/sigstore/cosign/releases/latest \
            --jq 'select(.draft == false and .prerelease == false) | .tag_name')
          [[ "${release}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "release=${release}" >> "$GITHUB_OUTPUT"

      # Upstream has no floating v4 tag. Keep the published stable installer;
      # resolve the Cosign binary independently of its embedded default.
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: ${{ steps.cosign.outputs.release }}

      - name: Sign and verify candidate
        env:
          IMAGE: ${{ steps.meta.outputs.image }}@${{ steps.candidate.outputs.digest }}
          CERTIFICATE_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cosign version
          cosign sign "${IMAGE}"
          cosign verify "${IMAGE}" \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Promote verified candidate
        env:
          IMAGE: ${{ steps.meta.outputs.image }}@${{ steps.candidate.outputs.digest }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
          IMMUTABLE: ${{ steps.meta.outputs.immutable }}
          LATEST: ${{ steps.meta.outputs.latest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "${IMMUTABLE}" --tag "${LATEST}" "${IMAGE}"
          for tag in "${IMMUTABLE}" "${LATEST}"; do
            actual=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${tag}")
            test "${actual}" = "${DIGEST}"
          done

      - id: harbor
        name: Mirror and sign Harbor image (best effort)
        if: env.HARBOR_REGISTRY != ''
        continue-on-error: true
        env:
          IMAGE: ${{ steps.meta.outputs.image }}@${{ steps.candidate.outputs.digest }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
          HARBOR_IMMUTABLE: ${{ steps.meta.outputs.harbor_immutable }}
          HARBOR_LATEST: ${{ steps.meta.outputs.harbor_latest }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          CERTIFICATE_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          if [ -z "${HARBOR_USERNAME}" ] || [ -z "${HARBOR_PASSWORD}" ]; then
            echo "::warning::Harbor credentials are not configured"
            exit 1
          fi
          printf '%s' "${HARBOR_PASSWORD}" | timeout 30 docker login "${HARBOR_REGISTRY}" \
            --username "${HARBOR_USERNAME}" --password-stdin
          docker buildx imagetools create --tag "${HARBOR_IMMUTABLE}" \
            --tag "${HARBOR_LATEST}" "${IMAGE}"
          cosign sign "${HARBOR_IMMUTABLE}@${DIGEST}"
          cosign verify "${HARBOR_IMMUTABLE}@${DIGEST}" \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Summary
        env:
          IMMUTABLE: ${{ steps.meta.outputs.immutable }}
          LATEST: ${{ steps.meta.outputs.latest }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
          COSIGN_RELEASE: ${{ steps.cosign.outputs.release }}
          HARBOR_OUTCOME: ${{ steps.harbor.outcome }}
        run: |
          {
            echo '## Image published'
            echo '```'
            echo "${IMMUTABLE}"
            echo "${LATEST}"
            echo "${DIGEST}"
            echo '```'
            echo "Cosign: ${COSIGN_RELEASE}"
            echo "Harbor mirror and signature: ${HARBOR_OUTCOME}"
          } >> "$GITHUB_STEP_SUMMARY"
